# Independent paired YOLO11s-OBB prototype; no random augmentation.
# Paths are repository-relative except the unmodified dataset root.
output_dir: ./outputs/yolo11s_rgbt_atrumod_condition_align_seed0
data_root: /home/reverse/workspace/data/ATR-UMOD
pretrained: ./pretrain/ultralytics/yolo11s-obb.pt
anchor_dir: ./pretrain/condition_anchors/clip_vit_b16_joint_512
texts_path: ./configs/dataset/atrumod_condition_texts.json

# Three environment IDs -> original frozen CLIP512 -> FiLM/CG-DMF.
# Normalized height/angle -> deterministic 5D descriptor -> RGB-only resampling.
variant: condition
alignment: geometry
condition_mode: real
enable_film: true
dynamic_fusion: true
score_condition: true
max_shift_px: 12.0
input_size: [512, 640]

# Prototype continuity: official test has already participated in development.
# This does not represent a newly untouched test set or formal paper protocol.
validation_split: test
epochs: 36
batch: 8
val_batch: 16
workers: 4
seed: 0
amp: true

# Historical AdamW carrier for reproducing the first YOLO run.
# New SGD experiments include atrumod_yolo11s_sgd_base.yml instead.
optimizer: AdamW
lr_pretrained: 0.0001
lr_new: 0.001
lr_final_ratio: 0.1
weight_decay: 0.0001
warmup_iterations: 500
momentum: 0.937
warmup_momentum: 0.9
nesterov: false
clip_norm: 10.0
min_gt_side_px: 2.0
conf: 0.001
nms_iou: 0.7
max_det: 300
